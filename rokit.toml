# This file lists tools managed by Rokit, a toolchain manager for Roblox projects.
# For more information, see https://github.com/rojo-rbx/rokit

# New tools can be added by running `rokit add <tool>` in a terminal.

[tools]
rojo = "rojo-rbx/rojo@7.7.0"
# Runs the game's suites. Pinned to the version CI installs: the compile sweep
# asserts where that exact Luau runs out of registers.
lune = "lune-org/lune@0.10.5"
# Read by the lint suite. An unknown global is a lint finding, not a compile error.
luau-lsp = "JohnnyMorganz/luau-lsp@1.58.0"
