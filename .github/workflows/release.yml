name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the tools pinned in rokit.toml (rojo, wally).
      - uses: CompeyDev/setup-rokit@v0.1.2

      - name: Build model
        run: rojo build default.project.json --output Ro2DEngine.rbxm

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: Ro2DEngine.rbxm
          generate_release_notes: true

  # Publishing to the Wally registry is optional. Add a WALLY_TOKEN secret and
  # uncomment to publish the package on each tagged release.
  #
  # wally:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: CompeyDev/setup-rokit@v0.1.2
  #     - run: wally login --token "${{ secrets.WALLY_TOKEN }}"
  #     - run: wally publish
