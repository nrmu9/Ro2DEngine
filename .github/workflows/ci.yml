name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ROJO_VERSION: "7.7.0"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rojo
        run: |
          curl -fsSL -o "$RUNNER_TEMP/rojo.zip" \
            "https://github.com/rojo-rbx/rojo/releases/download/v$ROJO_VERSION/rojo-$ROJO_VERSION-linux-x86_64.zip"
          unzip -q "$RUNNER_TEMP/rojo.zip" -d "$RUNNER_TEMP/rojo"
          chmod +x "$RUNNER_TEMP/rojo/rojo"
          echo "$RUNNER_TEMP/rojo" >> "$GITHUB_PATH"

      - name: Build model
        run: rojo build default.project.json --output Ro2DEngine.rbxm

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Ro2DEngine-rbxm
          path: Ro2DEngine.rbxm
